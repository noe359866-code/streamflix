// Dependency-free checks: ./gradlew -p gradle/build-config-tests check --no-configuration-cache
apply from: '../build-config.gradle'

def resolve = { Map layers = [:] ->
    resolveStreamflixBuildConfig { name ->
        def source = [layers.gradle, layers.environment, layers.local].find {
            it != null && it.containsKey(name)
        }
        source == null ? null : source[name]
    }
}

tasks.register('checkBuildConfiguration') {
    group = 'verification'
    description = 'Checks TV-only configuration, precedence, defaults and escaping.'
    doLast {
        def defaults = resolve()
        assert defaults.appLayout == 'tv'
        assert defaults.buildConfigFields == [
            APP_LAYOUT: '"tv"', TMDB_API_KEY: '""', SUBDL_API_KEY: '""', RABBITSTREAM_SOURCE_API: '""',
        ]
        assert defaults.configuredSettings.values().every { !it }
        assert resolve(local: [APP_LAYOUT: ' tv ']).appLayout == 'tv'
        assert resolve(local: [APP_LAYOUT: '']).appLayout == 'tv'
        assert resolve(local: [APP_LAYOUT: null]).appLayout == 'tv'
        def precedence = resolve(
            gradle: [APP_LAYOUT: 'tv', TMDB_API_KEY: 'gradle-key'],
            environment: [TMDB_API_KEY: 'environment-key'],
            local: [TMDB_API_KEY: 'local-key'],
        )
        assert precedence.buildConfigFields.TMDB_API_KEY == '"gradle-key"'
        assert resolve(environment: [SUBDL_API_KEY: 'environment-key'], local: [SUBDL_API_KEY: 'local-key'])
            .buildConfigFields.SUBDL_API_KEY == '"environment-key"'
        assert resolve(gradle: [SUBDL_API_KEY: '']).buildConfigFields.SUBDL_API_KEY == '""'
        ['desktop', 'TV', 'mobile', 'universal', 'mobile,tv'].each { layout ->
            def rejected = false
            try { resolve(local: [APP_LAYOUT: layout]) }
            catch (GradleException expected) {
                rejected = expected.message.contains('Android TV only')
                assert !expected.message.contains('API_KEY')
            }
            assert rejected: "APP_LAYOUT=${layout} should be rejected"
        }
        def special = resolve(local: [TMDB_API_KEY: 'a"b\\c\nd\te', RABBITSTREAM_SOURCE_API: 'https://example.invalid/sources/'])
        assert special.buildConfigFields.TMDB_API_KEY == '"a\\"b\\\\c\\nd\\te"'
        assert special.buildConfigFields.RABBITSTREAM_SOURCE_API == '"https://example.invalid/sources/"'
        assert special.configuredSettings == [TMDB_API_KEY: true, SUBDL_API_KEY: false, RABBITSTREAM_SOURCE_API: true]
        assert !special.configuredSettings.toString().contains('example.invalid')
    }
}

tasks.register('checkLayoutManifests') {
    group = 'verification'
    description = 'Checks the single required-Leanback TV manifest and external-player queries.'
    doLast {
        def file = rootProject.file('../../app/src/main/AndroidManifest.xml')
        def manifest = new XmlParser(false, false).parse(file)
        def android = '{http://schemas.android.com/apk/res/android}'
        def features = manifest.children().findAll { it.name() == 'uses-feature' }
        def leanback = features.find { it.attribute("${android}name") == 'android.software.leanback' }
        assert leanback?.attribute("${android}required") == 'true'
        def touchscreen = features.find { it.attribute("${android}name") == 'android.hardware.touchscreen' }
        assert touchscreen?.attribute("${android}required") == 'false'
        def activities = manifest.application.activity.findAll { activity ->
            activity.'intent-filter'.any { filter ->
                filter.action.any { it.attribute("${android}name") == 'android.intent.action.MAIN' } &&
                    filter.category.any { it.attribute("${android}name") == 'android.intent.category.LEANBACK_LAUNCHER' }
            }
        }
        assert activities.size() == 1
        assert activities[0].attribute("${android}name") == '.activities.main.MainTvActivity'
        assert manifest.depthFirst().every { node ->
            !(node instanceof Node) || node.attribute("${android}name") != '.activities.main.MainMobileActivity'
        }
        assert manifest.application.attribute("${android}banner") == '@mipmap/ic_banner'
        def queries = manifest.depthFirst().find { it instanceof Node && it.name() == 'queries' }
        assert queries != null
        assert queries.depthFirst().any { it instanceof Node && it.attribute("${android}mimeType") == 'video/*' }
        assert !rootProject.file('../../app/src/main/mobile/AndroidManifest.xml').exists()
        assert !rootProject.file('../../app/src/main/tv/AndroidManifest.xml').exists()
    }
}

tasks.register('check') {
    dependsOn tasks.named('checkBuildConfiguration'), tasks.named('checkLayoutManifests')
}
