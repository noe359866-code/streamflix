name: Build Debug APK

on:
  push:
    branches:
      - 'arena/**'
      - 'main'
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  build-debug:
    name: Build Debug APK (Android TV VOD)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        id: build
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee gradle-build.log
          EC=${PIPESTATUS[0]}
          echo "exit_code=$EC" >> $GITHUB_OUTPUT
          tail -n 800 gradle-build.log > gradle-tail.log || true
          if [ "$EC" != "0" ]; then
            echo "::error::Gradle assembleDebug FAILED with exit $EC"
            echo "===== TAIL 200 LINES ====="
            tail -n 200 gradle-build.log || true
            echo "===== GREP FAILED / error: ====="
            grep -i -E "FAILED|error:|e: " gradle-build.log | head -n 120 || true
            exit $EC
          fi

      - name: Publish Gradle log to branch
        if: always()
        run: |
          set -x
          ls -lh gradle-build.log gradle-tail.log || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin arena/f3c71883-streamflix --depth=1 || true
          # Create log commit on dedicated branch
          git checkout --orphan ci-log-tmp
          git rm -rf . 2>/dev/null || true
          cp $GITHUB_WORKSPACE/gradle-build.log ./gradle-build.log 2>/dev/null || echo "no log" > ./gradle-build.log
          cp $GITHUB_WORKSPACE/gradle-tail.log ./gradle-tail.log 2>/dev/null || echo "no tail" > ./gradle-tail.log
          echo "$GITHUB_RUN_ID" > run-id.txt
          git add gradle-build.log gradle-tail.log run-id.txt
          git commit -m "ci log $GITHUB_RUN_ID exit ${{ steps.build.outputs.exit_code || 'unknown' }}" || true
          git push origin HEAD:arena/f3c71883-streamflix-ci-log --force

      - name: Upload Gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: streamflix-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
