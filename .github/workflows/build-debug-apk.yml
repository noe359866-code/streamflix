name: Build Debug APK

on:
  push:
    branches:
      - 'arena/**'
      - 'main'
    paths-ignore:
      - '**.md'
      - 'gradle-build.log'
      - 'gradle-tail.log'
  workflow_dispatch:

jobs:
  build-debug:
    name: Build Debug APK (Android TV VOD)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        id: build
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee gradle-build.log
          EC=${PIPESTATUS[0]}
          echo "exit_code=$EC" >> $GITHUB_OUTPUT
          tail -n 300 gradle-build.log > gradle-tail.log || true
          if [ "$EC" != "0" ]; then
            echo "::error::Gradle assembleDebug FAILED with exit $EC"
            echo "===== TAIL 200 LINES ====="
            tail -n 200 gradle-build.log || true
            echo "===== GREP FAILED / error: ====="
            grep -i -E "FAILED|error:|e: " gradle-build.log | head -n 80 || true
            exit $EC
          fi

      - name: Publish Gradle log to repo (for sandbox fetch)
        if: always()
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Ensure we are on the correct branch
          git fetch origin ${{ github.ref_name }} 2>/dev/null || true
          # Copy logs to repo root (they are already there, but ensure tail exists)
          ls -lh gradle-build.log gradle-tail.log 2>/dev/null || true
          git add -f gradle-build.log gradle-tail.log 2>/dev/null || true
          git status --short
          if git diff --cached --quiet; then
            echo "No log changes to commit"
            exit 0
          fi
          git commit -m "[skip ci] ci: gradle log for run $GITHUB_RUN_ID (exit ${{ steps.build.outputs.exit_code || 'unknown' }})"
          git push origin HEAD:${{ github.ref_name }}
          echo "Pushed log"

      - name: Upload Gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: streamflix-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
