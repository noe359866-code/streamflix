name: Build check

on:
  pull_request:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-configuration:
    name: Build configuration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Test configuration without Android SDK or local.properties
        run: |
          if ! ./gradlew -p gradle/build-config-tests check --no-configuration-cache --stacktrace > /tmp/streamflix-build-config.log 2>&1; then
            cat /tmp/streamflix-build-config.log
            python3 - <<'PY'
            from pathlib import Path
            from urllib.parse import quote
            text = '\n'.join(Path('/tmp/streamflix-build-config.log').read_text().splitlines()[-65:])
            print('::error title=Build configuration tests::' + quote(text, safe=''))
            PY
            exit 1
          fi
          cat /tmp/streamflix-build-config.log

  build:
    name: Debug APK (${{ matrix.layout }})
    needs: build-configuration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        layout: [universal, mobile, tv]
    env:
      APP_LAYOUT: ${{ matrix.layout }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Show non-secret build configuration
        run: ./gradlew :app:printBuildConfiguration
      - name: Build from a clean checkout without service credentials
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Verify APK output
        run: test -f app/build/outputs/apk/debug/app-debug.apk
