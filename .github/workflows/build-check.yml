name: Build check

on:
  pull_request:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-configuration:
    name: Build configuration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test configuration without Android SDK or local.properties
        run: ./gradlew -p gradle/build-config-tests check --no-configuration-cache --stacktrace

  build:
    name: Debug APK (${{ matrix.layout }})
    needs: build-configuration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        layout: [universal, mobile, tv]
    env:
      APP_LAYOUT: ${{ matrix.layout }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Show non-secret build configuration
        run: ./gradlew :app:printBuildConfiguration
      - name: Build from a clean checkout without service credentials
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Verify APK output
        run: test -f app/build/outputs/apk/debug/app-debug.apk
