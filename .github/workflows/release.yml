name: Build & Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Release APK (${{ matrix.layout }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - layout: universal
            suffix: ''
          - layout: mobile
            suffix: '-mobile'
          - layout: tv
            suffix: '-tv'
    env:
      APP_LAYOUT: ${{ matrix.layout }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      SUBDL_API_KEY: ${{ secrets.SUBDL_API_KEY }}
      RABBITSTREAM_SOURCE_API: ${{ secrets.RABBITSTREAM_SOURCE_API }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check signing configuration
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE SIGNING_KEY_ALIAS SIGNING_STORE_PASSWORD SIGNING_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required release signing secret ${name} is not configured."
              exit 1
            fi
          done

      - name: Show non-secret build configuration
        run: ./gradlew :app:printBuildConfiguration

      # Each layout runs on a fresh checkout. No local.properties mutations and
      # no release directory shared with another layout.
      - name: Build APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Sign APK
        id: sign_apk
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE }}
          alias: ${{ secrets.SIGNING_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.SIGNING_STORE_PASSWORD }}
          keyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '34.0.0'

      - name: Prepare release artifact
        env:
          SIGNED_APK: ${{ steps.sign_apk.outputs.signedReleaseFile }}
          ASSET_NAME: ${{ github.event.repository.name }}-${{ github.ref_name }}${{ matrix.suffix }}.apk
        run: |
          mkdir -p release-artifacts
          cp "$SIGNED_APK" "release-artifacts/$ASSET_NAME"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ matrix.layout }}
          path: release-artifacts/*.apk
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Publish only after all three signed APKs have been built successfully.
      - name: Download signed APKs
        uses: actions/download-artifact@v4
        with:
          pattern: release-apk-*
          path: release-artifacts
          merge-multiple: true

      - name: Create release with all layouts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-artifacts/*.apk \
            --title "Release $GITHUB_REF_NAME" \
            --generate-notes
