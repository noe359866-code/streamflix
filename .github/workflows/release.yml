name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a publicar (ej. 1.0.0). Si se deja vacío se usa la del tag.'
        required: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Los runners de GitHub traen el Android SDK preinstalado (ANDROID_HOME).
      # No se instala nada extra para evitar fallos de red del instalador.
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          ls "${ANDROID_HOME}/platforms" || true
          ls "${ANDROID_HOME}/build-tools" || true

      - name: Accept Android licenses
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publicando versión $VERSION"

      - name: local.properties
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          RABBITSTREAM_SOURCE_API: ${{ secrets.RABBITSTREAM_SOURCE_API }}
          SUBDL_API_KEY: ${{ secrets.SUBDL_API_KEY }}
        run: |
          {
            echo "TMDB_API_KEY=${TMDB_API_KEY}"
            echo "RABBITSTREAM_SOURCE_API=${RABBITSTREAM_SOURCE_API}"
            echo "SUBDL_API_KEY=${SUBDL_API_KEY}"
          } > local.properties

      # Keystore efímero para que el APK quede firmado e instalable aunque el
      # repositorio no tenga secretos de firma configurados.
      - name: Generate signing key
        run: |
          mkdir -p ci-signing
          keytool -genkeypair -v \
            -keystore ci-signing/release.keystore \
            -storepass streamflix -keypass streamflix \
            -alias streamflix -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=StreamFlix, OU=Arena, O=StreamFlix, L=Managua, C=NI"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Android TV: layout tv (el manifest de TV exige leanback).
      - name: Build APK (TV)
        run: |
          set -o pipefail
          echo "APP_LAYOUT=tv" >> local.properties
          ./gradlew :app:assembleRelease --stacktrace --no-daemon 2>&1 | tee build-tv.log

      - name: Collect APK (TV)
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk \
             "out/streamflix-${{ steps.version.outputs.value }}-tv.apk"

      # Celular: mismo binario con layout mobile forzado.
      - name: Build APK (Mobile)
        run: |
          set -o pipefail
          sed -i '/^APP_LAYOUT=/d' local.properties
          echo "APP_LAYOUT=mobile" >> local.properties
          ./gradlew :app:assembleRelease --stacktrace --no-daemon 2>&1 | tee build-mobile.log

      - name: Collect APK (Mobile)
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             "out/streamflix-${{ steps.version.outputs.value }}-mobile.apk"
          ls -lh out

      # Log completo de Gradle: se sube siempre para poder diagnosticar
      # fallos de compilación desde fuera del runner.
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-logs
          path: |
            build-tv.log
            build-mobile.log
          if-no-files-found: ignore

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: streamflix-${{ steps.version.outputs.value }}
          path: out/*.apk
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "StreamFlix ${{ steps.version.outputs.value }}" \
            --notes "APK de StreamFlix ${{ steps.version.outputs.value }} (Android TV y celular)." \
            out/*.apk
