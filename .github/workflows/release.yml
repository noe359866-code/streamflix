name: Build & Release Android TV APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: tv-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Required Android TV quality gate
    uses: ./.github/workflows/build-check.yml

  build:
    name: Signed Android TV APK
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      APP_LAYOUT: tv
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      SUBDL_API_KEY: ${{ secrets.SUBDL_API_KEY }}
      RABBITSTREAM_SOURCE_API: ${{ secrets.RABBITSTREAM_SOURCE_API }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Check signing configuration
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE SIGNING_KEY_ALIAS SIGNING_STORE_PASSWORD SIGNING_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required release signing secret ${name} is not configured."
              exit 1
            fi
          done
      - name: Show non-secret build configuration
        run: ./gradlew :app:printBuildConfiguration
      - name: Build Android TV release
        run: ./gradlew :app:assembleRelease --stacktrace
      - name: Sign APK
        id: sign_apk
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE }}
          alias: ${{ secrets.SIGNING_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.SIGNING_STORE_PASSWORD }}
          keyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '34.0.0'
      - name: Prepare the only supported release asset
        env:
          SIGNED_APK: ${{ steps.sign_apk.outputs.signedReleaseFile }}
          ASSET_NAME: ${{ github.event.repository.name }}-${{ github.ref_name }}-tv.apk
        run: |
          mkdir -p release-artifacts
          cp "$SIGNED_APK" "release-artifacts/$ASSET_NAME"
      - uses: actions/upload-artifact@v7
        with:
          name: release-apk-tv
          path: release-artifacts/*.apk
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish Android TV release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-apk-tv
          path: release-artifacts
      - name: Create release with the TV APK only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-artifacts/*-tv.apk \
            --title "Release $GITHUB_REF_NAME" \
            --generate-notes
